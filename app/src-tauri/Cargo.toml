[package]
name = "greasan"
version = "0.2.5"
edition = "2021"

[lib]
name = "greasan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Irish morphology - declension/conjugation enrichment for classless TBX records
# (the on-device counterpart of the Python tbx.py pipeline). `default-features`
# off so the optional PyO3 `python` feature is NOT pulled into the app build.
gramadan = { path = "../../../Gramadan/gramadan-rs", default-features = false }
alizarin-core = { path = "../../../magic/alizarin/crates/alizarin-core" }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "sync"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
unicode-normalization = "0.1"

# --- v2 static-assets pilot (optional; see src/v2.rs) -----------------------
# NOTE: alizarin-core-v2 alias removed - line 30 `alizarin-core` now points at
# the sandbox core directly, so the app and v2 stack share ONE core (.122).
# v2.rs uses `alizarin_core` (not the old `alizarin_core_v2` alias).
# The native read path: hydration, tile recovery, manifest loading. Replaces the
# hand-rolled dict/spine/fragment_dir/chunks join and the msgpack read loop that
# used to live in v2.rs.
ros-madair-read = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-read", optional = true }
# The artifact format types - notably `Manifest.handlers`, which is what makes
# the registry below derivable instead of guessable.
ros-madair-format = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-format", optional = true }
# The single source of the extension-type registry. We no longer hand-build one
# from alizarin-clm-core: the registry is rebuilt from the handler set the
# *manifest declares*, so an emit/query registry mismatch fails loudly instead of
# silently returning zero rows.
ros-madair-handlers = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-handlers", optional = true }
ros-madair-query = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-query", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Regeneration only (`v2-emit`) - see examples/regen-macbain-v2.rs. Emitting from
# *this* workspace keeps us off the sandbox's target/ lock and Cargo.lock, which
# `cargo run -p ros-madair-emit --manifest-path <sandbox>` would take.
ros-madair-emit = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-emit", optional = true }
# --- DuckDB+Parquet substrate (migration, see HANDOFF-substrate-migration-and-mobile.md) ---
# ros-madair-duck compiles the ros-madair-query IR to DuckDB SQL over tile-row
# Parquet. `duckdb` is the native binding; bundled+json+parquet static-link the
# amalgamation + the parquet reader so read_parquet works OFFLINE (no INSTALL).
ros-madair-duck = { path = "../../../magic/RosMadair-sandbox-parquet/crates/ros-madair-duck", optional = true }
duckdb = { version = "1", features = ["bundled", "json", "parquet"], optional = true }
# The gramadan Derive provider: generates the `forms` nodegroup on demand from
# gramadan-rs. Registered into the FunctionsRegistry the duck hydrate path runs,
# so a computed layer's presence spine materialises paradigm forms JIT.
greasan-gramadan = { path = "../../crates/greasan-gramadan", optional = true }

[features]
# v2-emit is the shipping build now that the v1 ros-madair-core path is retired:
# it pulls in the v2 read stack (`v2`) + the emitter. v2-duck (DuckDB+Parquet)
# stays opt-in for the full APK; nav-server is never in a public release.
default = ["v2-emit"]
v2 = [
    "dep:ros-madair-read",
    "dep:ros-madair-format",
    "dep:ros-madair-handlers",
    "dep:ros-madair-query",
    "dep:rusqlite",
]
# The DuckDB+Parquet read path (migration in progress). Builds on v2-emit (the
# real app feature set) so it also exercises the app's emit calls against the
# parquet emit crate; adds the native duckdb build + ros-madair-duck alongside.
v2-duck = ["v2-emit", "dep:ros-madair-duck", "dep:duckdb", "dep:greasan-gramadan"]
v2-emit = ["v2", "dep:ros-madair-emit"]
# Debug-only localhost navigation channel for deterministic driving (see
# src/navserver.rs). Never enable for a public release.
nav-server = []

[[example]]
name = "regen-macbain-v2"
required-features = ["v2-emit"]

[[example]]
name = "regen-layer-v2"
required-features = ["v2-emit"]

[[example]]
name = "regen-parquet-v2"
required-features = ["v2-emit"]

[[example]]
name = "duck-probe"
required-features = ["v2-duck"]

[[example]]
name = "geo-probe"
required-features = ["v2-duck"]

[[example]]
name = "verify-bunamo-compose"
required-features = ["v2"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# Read bundled APK assets (heads + pagefind zips) from Rust on first run:
# resource_dir() is `asset://localhost/` on Android, unreadable by std::fs.
ndk = "0.9"
ndk-sys = "0.6"
# Tauri v2 runs a Java `WryActivity` (not a NativeActivity), so nothing ever
# calls `ndk_context::initialize_android_context` - leaving `android_context()`
# to panic-abort. tao (already a transitive dep via wry) holds the real
# JavaVM + Activity in `main_android_context()`; we bridge it into ndk_context
# at startup. default-features=false keeps this to a feature-union no-op - the
# version resolves to the same tao wry already pulls, so no extra deps.
tao = { version = "0.35", default-features = false }

[patch.crates-io]
# Transitive deps (the published ros-madair-* / alizarin-* crates) request
# alizarin-core from crates.io by version; redirect that to the single local
# core the whole app builds against, so there is one copy in the graph.
alizarin-core = { path = "../../../magic/alizarin/crates/alizarin-core" }

[[example]]
name = "hydrate-probe"
required-features = ["v2-duck"]

[[example]]
name = "compose-probe"
required-features = ["v2-duck"]
