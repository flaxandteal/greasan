[package]
name = "greasan"
version = "0.1.0"
edition = "2021"

[lib]
name = "greasan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Irish morphology — declension/conjugation enrichment for classless TBX records
# (the on-device counterpart of the Python tbx.py pipeline). `default-features`
# off so the optional PyO3 `python` feature is NOT pulled into the app build.
gramadan = { path = "../../../Gramadan/gramadan-rs", default-features = false }
ros-madair-core = { path = "../../../magic/RosMadair/crates/ros-madair-core" }
# v1 and the shipping app build against the REAL core (2.0.0-alpha.120). The v2
# pilot links a *second* copy — the sandbox core, 2.0.0-alpha.121 — under the
# `alizarin-core-v2` alias below.
#
# That used to be impossible: both cores were 2.0.0-alpha.120, and a lockfile
# cannot hold two same-name/same-version packages from different paths ("package
# collision in the lockfile"), so the whole app was dragged onto the sandbox
# core. Upstream bumped the sandbox core to .121, so the two are now
# distinguishable and cargo locks both.
alizarin-core = { path = "../../../magic/alizarin-sandbox/crates/alizarin-core" }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "sync"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
unicode-normalization = "0.1"
pagefind = { path = "../../../svg/malazan-experiment/pagefind/pagefind", default-features = false }

# --- v2 static-assets pilot (optional; see src/v2.rs) -----------------------
# NOTE: alizarin-core-v2 alias removed — line 30 `alizarin-core` now points at
# the sandbox core directly, so the app and v2 stack share ONE core (.122).
# v2.rs uses `alizarin_core` (not the old `alizarin_core_v2` alias).
# The native read path: hydration, tile recovery, manifest loading. Replaces the
# hand-rolled dict/spine/fragment_dir/chunks join and the msgpack read loop that
# used to live in v2.rs.
ros-madair-read = { path = "../../../magic/RosMadair-sandbox/crates/ros-madair-read", optional = true }
# The artifact format types — notably `Manifest.handlers`, which is what makes
# the registry below derivable instead of guessable.
ros-madair-format = { path = "../../../magic/RosMadair-sandbox/crates/ros-madair-format", optional = true }
# The single source of the extension-type registry. We no longer hand-build one
# from alizarin-clm-core: the registry is rebuilt from the handler set the
# *manifest declares*, so an emit/query registry mismatch fails loudly instead of
# silently returning zero rows.
ros-madair-handlers = { path = "../../../magic/RosMadair-sandbox/crates/ros-madair-handlers", optional = true }
ros-madair-query = { path = "../../../magic/RosMadair-sandbox/crates/ros-madair-query", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Regeneration only (`v2-emit`) — see examples/regen-macbain-v2.rs. Emitting from
# *this* workspace keeps us off the sandbox's target/ lock and Cargo.lock, which
# `cargo run -p ros-madair-emit --manifest-path <sandbox>` would take.
ros-madair-emit = { path = "../../../magic/RosMadair-sandbox/crates/ros-madair-emit", optional = true }

[features]
v2 = [
    "dep:ros-madair-read",
    "dep:ros-madair-format",
    "dep:ros-madair-handlers",
    "dep:ros-madair-query",
    "dep:rusqlite",
]
v2-emit = ["v2", "dep:ros-madair-emit"]
# Debug-only localhost navigation channel for deterministic driving (see
# src/navserver.rs). Never enable for a public release.
nav-server = []

[[example]]
name = "regen-macbain-v2"
required-features = ["v2-emit"]

[[example]]
name = "regen-layer-v2"
required-features = ["v2-emit"]

[[example]]
name = "verify-bunamo-compose"
required-features = ["v2"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# Read bundled APK assets (heads + pagefind zips) from Rust on first run:
# resource_dir() is `asset://localhost/` on Android, unreadable by std::fs.
ndk = "0.9"
ndk-sys = "0.6"
# Tauri v2 runs a Java `WryActivity` (not a NativeActivity), so nothing ever
# calls `ndk_context::initialize_android_context` — leaving `android_context()`
# to panic-abort. tao (already a transitive dep via wry) holds the real
# JavaVM + Activity in `main_android_context()`; we bridge it into ndk_context
# at startup. default-features=false keeps this to a feature-union no-op — the
# version resolves to the same tao wry already pulls, so no extra deps.
tao = { version = "0.35", default-features = false }

[patch.crates-io]
# ros-madair-core (v1) asks crates.io for alizarin-core; point it at the same
# real local core the app uses, so v1 types match. The sandbox core is NOT
# patched in here — the v2 crates reach it by path, which is exactly what lets
# the two versions coexist.
alizarin-core = { path = "../../../magic/alizarin-sandbox/crates/alizarin-core" }
