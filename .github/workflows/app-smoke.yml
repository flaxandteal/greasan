name: App smoke (base-only)

# Fast per-push sanity build: compiles the app and packages a BASE-ONLY APK
# (core metadata + basemap, no data heads). It exists to catch Rust/Svelte/
# packaging breakage on every push and PR WITHOUT fetching ~1 GB of corpus or
# regenerating any bundle. The full data-bundled APK is built only on release
# tags (app-release.yml), and the corpus lives in its own repo (greasan-data).
#
# Base-only is not a crippled build - it is the app's native layer-first model:
# it boots to the empty state and installs layers at runtime. So this same
# artifact doubles as a distributable "bring your own layers" APK.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]        # release tags are handled by app-release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight smoke builds for the same ref; the latest push wins.
  group: app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.11902837"
    steps:
      - name: Free up disk
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          large-packages: true
          docker-images: true
          tool-cache: false

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPS_PAT }}

      - name: Reconstruct sibling layout
        run: bash scripts/ci/link-siblings.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain (+ Android + wasm targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            .deps/RosMadair

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}"
      - name: Export NDK env
        run: echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Build ros-madair-alizarin (combined wasm)
        working-directory: .deps/RosMadair
        run: |
          npm ci
          npm run build:combined

      - name: npm ci (app)
        working-directory: app
        run: npm ci

      - name: tauri android init
        working-directory: app
        run: npm run tauri android init -- --skip-targets-install

      - name: Apply foreground-service overlay
        run: bash scripts/ci/apply-android-overlay.sh app/src-tauri

      # Base-only, debug-signed (no keystore secret needed), parquet substrate.
      # No data fetch: --base ships zero heads, so there is nothing to download.
      - name: Build base-only APK
        run: scripts/build-apk.sh --base --duck --debug

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: greasan-base-${{ github.sha }}
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 7
          if-no-files-found: error
