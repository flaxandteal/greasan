[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goidelic"
version = "0.2.0"
description = "Goidelic Wiktionary extraction pipeline for Rós Madair / Alizarin"
requires-python = ">=3.13"
license = "CC-BY-SA-4.0"
dependencies = [
    "orjson>=3.10",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goidelic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
